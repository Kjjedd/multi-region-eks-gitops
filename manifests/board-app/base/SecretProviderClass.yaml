# Public template: replace <AWS_SECRETS_MANAGER_SECRET_ARN> in a private overlay before deployment.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-secrets
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: '<AWS_SECRETS_MANAGER_SECRET_ARN>'
        objectType: secretsmanager
        jmesPath:
          - path: username
            objectAlias: username
          - path: password
            objectAlias: password    
  secretObjects:
    - secretName: board-app-secret
      type: Opaque
      data:
        - objectName: username
          key: DB_USER
        - objectName: password
          key: DB_PASSWORD
